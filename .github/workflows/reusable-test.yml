name: '[Reusable] Blob Trigger Pytest'

on:
  workflow_call:
    inputs:
      ACT_MODE:
        description: |
          For running Github Action Workflows locally with Nektos act
        required: true
        type: boolean
      markers:
        description: |
          PyTest Markers to select specific tests to work within Github Action Workflows
        required: true
        type: string
      working_directory:
        description: |
          Working directory containing Terraform test scripts.
        required: false
        type: string
        default: "./test/data_lake"
    
    secrets:
      AZURE_CLIENT_ID:
        description: |
          Azure Service Account Client ID for authentication
        required: true
      AZURE_CLIENT_SECRET:
        description: |
          Azure Service Account Client Secret for Authentication (when running locally)
        required: true
      AZURE_TENANT_ID:
        description: |
          Azure Tenant ID
        required: true
      TF_API_TOKEN:
        description: |
          Terraform.io Access Token
        required: true

#Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  terraform-output:
    name: Terraform Output
    runs-on: ubuntu-latest
    
    defaults:
        run:
          working-directory: "${{ inputs.working_directory }}"
    
    outputs:
      BRONZE_BUCKET_NAME: "${{ steps.tf-raw.outputs.BRONZE_BUCKET_NAME }}"
      BRONZE_BUCKET_CONTAINER_NAME: "${{ steps.tf-raw.outputs.BRONZE_BUCKET_CONTAINER_NAME }}"
      SILVER_BUCKET_NAME: "${{ steps.tf-raw.outputs.SILVER_BUCKET_NAME }}"
      SILVER_BUCKET_CONTAINER_NAME: "${{ steps.tf-raw.outputs.SILVER_BUCKET_CONTAINER_NAME }}"
      GOLD_BUCKET_NAME: "${{ steps.tf-raw.outputs.GOLD_BUCKET_NAME }}"
      GOLD_BUCKET_CONTAINER_NAME: "${{ steps.tf-raw.outputs.GOLD_BUCKET_CONTAINER_NAME }}"

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4
    
    # Install the latest version of the Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
        terraform_wrapper: false
    
    - name: terraform init
      run: terraform init

    - name: terraform raw output
      id: tf-raw
      run: |
        {
          echo "BRONZE_BUCKET_NAME=$(terraform output -raw bronze_bucket_name)"
          echo "BRONZE_BUCKET_CONTAINER_NAME=$(terraform output -raw bronze_bucket_container_name)"
          echo "SILVER_BUCKET_NAME=$(terraform output -raw silver_bucket_name)"
          echo "SILVER_BUCKET_CONTAINER_NAME=$(terraform output -raw silver_bucket_container_name)"
          echo "GOLD_BUCKET_NAME=$(terraform output -raw gold_bucket_name)"
          echo "GOLD_BUCKET_CONTAINER_NAME=$(terraform output -raw gold_bucket_container_name)"
        } >> "$GITHUB_OUTPUT"
  
  terraform-test:
    name: Terraform Test
    needs: [ terraform-output ]
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
      AZURE_CLIENT_SECRET: "${{ secrets.AZURE_CLIENT_SECRET }}"
      AZURE_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
    
    defaults:
      run:
        working-directory: "${{ inputs.working_directory }}/unit_test"
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup Python # Set Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - uses: actions/github-script@v6
        id: script
        timeout-minutes: 10
        with:
          debug: true
          script: |
            const token = process.env['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
            const runtimeUrl = process.env['ACTIONS_ID_TOKEN_REQUEST_URL']
            if ( token && runtimeUrl ) {
              core.setOutput('TOKEN', token.trim())
              core.setOutput('IDTOKENURL', runtimeUrl.trim())  

              const idtoken = await core.getIDToken('api://AzureADTokenExchange')
              core.setOutput('IDTOKEN', idtoken)
            }
      
      - id: jwt_token
        run: |
          jwtd() {
              if [[ -x $(command -v jq) ]]; then
                  jq -R 'split(".") | .[0],.[1] | @base64d | fromjson' <<< "${1}"
                  echo "Signature: $(echo "${1}" | awk -F'.' '{print $3}')"
              fi
          }
          if ${{ steps.script.outputs.IDTOKEN != '' }}
          then
            jwtd "${{ steps.script.outputs.IDTOKEN }}"
            echo "::add-mask::${{ steps.script.outputs.IDTOKEN }}"
            echo "OIDC_TOKEN=${{ steps.script.outputs.IDTOKEN }}" >> $GITHUB_ENV
          fi
      
      - name: Outputs Decode
        id: decode
        run: |
          {
            echo "BRONZE_BUCKET_NAME=${{ needs.terraform-output.outputs.BRONZE_BUCKET_NAME }}"
            echo "BRONZE_BUCKET_CONTAINER_NAME=${{ needs.terraform-output.outputs.BRONZE_BUCKET_CONTAINER_NAME }}"
            echo "SILVER_BUCKET_NAME=${{ needs.terraform-output.outputs.SILVER_BUCKET_NAME }}"
            echo "SILVER_BUCKET_CONTAINER_NAME=${{ needs.terraform-output.outputs.SILVER_BUCKET_CONTAINER_NAME }}"
            echo "GOLD_BUCKET_NAME=${{ needs.terraform-output.outputs.GOLD_BUCKET_NAME }}"
            echo "GOLD_BUCKET_CONTAINER_NAME=${{ needs.terraform-output.outputs.GOLD_BUCKET_CONTAINER_NAME }}"
          } >> "$GITHUB_ENV"
      
      # Install pip and pytest
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest adlfs fsspec uuid azure-identity
      
      - name: Test with pytest
        run: |
          pytest -m "${{ inputs.markers }}" \
            --doctest-modules \
            --junitxml=junit/test-results.xml
              
      - name: Upload pytest test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ${{ inputs.working_directory }}/unit_test/junit/test-results.xml
